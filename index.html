 "arm_b": "IL22", "direct_axes": "Type2+Barrier+Lipid+Remodel", "n_direct": 4, "rank": 8, "liabilities": "Most crowded ligand target (lebrikizumab/tralokinumab approved) | AMP suppression (beta-defensin 2/3, S100A7-A9) - infection-defence risk in S. aureus-colonised skin"}, {"arm_a": "IL13", "arm_b": "TSLP", "direct_axes": "Type2+Barrier+Lipid+Itch", "n_direct": 4, "rank": 9, "liabilities": "Most crowded ligand target (lebrikizumab/tralokinumab approved) | Tezepelumab Ph2 in AD did not clearly separate; alarmin-axis clinical risk"}, {"arm_a": "IL22", "arm_b": "IL31", "direct_axes": "Barrier+Itch+Remodel", "n_direct": 3, "rank": 19, "liabilities": "AMP suppression (beta-defensin 2/3, S100A7-A9) - infection-defence risk in S. aureus-colonised skin"}, {"arm_a": "IL4", "arm_b": "IL13", "direct_axes": "Type2+Barrier+Lipid", "n_direct": 3, "rank": 64, "liabilities": "Most crowded ligand target (lebrikizumab/tralokinumab approved)"}, {"arm_a": "TSLP", "arm_b": "IL31", "direct_axes": "Type2+Itch", "n_direct": 2, "rank": 71, "liabilities": "Tezepelumab Ph2 in AD did not clearly separate; alarmin-axis clinical risk"}], "totals": {"evaluated": 672}};

   p:"Cross-&alpha; fibril-forming cytolytic peptide. Lyses keratinocytes, degranulates mast cells IgE-independently, and releases IL-1&alpha;/IL-36 — the alarmin pool the TSLP arm sits downstream of.",

let view="pipe", selected="__root", particles=[], raf=null;

  const mk=(name,col)=>{const d=document.createElement("div");
    d.className="ac"+(AX[name]?" on":"");d.innerHTML=`<span class="d" style="${AX[name]?`background:${col};box-shadow:0 0 9px ${col}`:""}"></span>${name}`;
    d.onclick=()=>{AX[name]=!AX[name];render();};c.appendChild(d);};

}
const nAct=()=>Object.values(AX).filter(Boolean).length;

/* ---------------- view 1: pipeline ---------------- */
function drawPipe(){
  svg.innerHTML="";const g=el("g");svg.appendChild(g);particles=[];
  const cols=[{x:252,l:"Target + epitope"},{x:528,l:"RFdiffusion"},{x:784,l:"ProteinMPNN"},{x:1036,l:"Sequence gate"}];
  cols.forEach(c=>{g.appendChild(T(c.x,44,c.l,"ns","middle"));
    g.appendChild(el("line",{x1:c.x-100,y1:56,x2:c.x+100,y2:56,stroke:"#1d2636"}));});

 {id:"v8",x:940,y:214,w:174,h:54,t:"V8 protease",s:"Glutamyl endopeptidase",ax:"V8 protease"},

function drawMech(){

function loopClosed(){const adj={};

  while(st.length){const n=st.pop();if(n==="barrier")return true;
    if(seen.has(n))continue;seen.add(n);(adj[n]||[]).forEach(m=>st.push(m));}
  return false;}

  const br=ORDER.map(a=>({k:a,col:ARMS[a].color,lab:a,sub:ARMS[a].axis,
      leaves:[ARMS[a].evaluated+" designs","gate verified",ARMS[a].sites]}))
    .concat(Object.keys(SA).map(s=>({k:s,col:SA[s].color,lab:s.replace("&alpha;","α"),sub:SA[s].axis,
      leaves:["target defined","no sequences yet"]})));
  const sp=Math.PI*2/br.length;
  br.forEach((b,i)=>{const ang=-Math.PI/2+sp*i,bx=cx+Math.cos(ang)*252,by=cy+Math.sin(ang)*232,on=AX[b.k];
    const link=el("path",{d:`M${cx},${cy} Q${(cx+bx)/2},${(cy+by)/2} ${bx},${by}`,fill:"none",
      stroke:b.col,"stroke-width":2.6,opacity:on?.7:.15,"stroke-linecap":"round"});g.appendChild(link);
    if(on)particles.push({path:link,off:0,col:b.col},{path:link,off:.5,col:b.col});
    b.leaves.forEach((c,j)=>{const sa=ang+(j-(b.leaves.length-1)/2)*0.29;
      const sx=bx+Math.cos(sa)*150,sy=by+Math.sin(sa)*132;
      g.appendChild(el("path",{d:`M${bx},${by} Q${bx+Math.cos(sa)*76},${by+Math.sin(sa)*66} ${sx},${sy}`,
        fill:"none",stroke:b.col,"stroke-width":1.2,opacity:on?.38:.1}));
      const txt=c.length>30?c.slice(0,28)+"…":c, tw=Math.max(92,txt.length*6.6+20);
      const lf=el("g",{opacity:on?1:.22});
      lf.appendChild(el("rect",{x:sx-tw/2,y:sy-14,width:tw,height:28,rx:14,fill:"#111927",stroke:b.col,"stroke-width":1,opacity:.95}));
      const t=el("text",{x:sx,y:sy+4,"text-anchor":"middle",class:"ns"});t.setAttribute("fill","#ced7e5");t.textContent=txt;
      lf.appendChild(t);g.appendChild(lf);});
    const n=el("g",{class:"node",opacity:on?1:.3});
    n.appendChild(el("rect",{x:bx-104,y:by-27,width:208,height:54,rx:12,fill:"#16203a",stroke:b.col,"stroke-width":2}));
    n.appendChild(T(bx,by-4,b.lab,"nl","middle"));
    n.appendChild(T(bx,by+14,b.sub.length>30?b.sub.slice(0,28)+"…":b.sub,"ns","middle"));
    n.onclick=()=>{selected=b.k;render();};g.appendChild(n);});
  const pu=el("circle",{cx,cy,r:64,fill:"none",stroke:"#4ea8ff","stroke-width":1.5,opacity:.45});
  pu.append(el("animate",{attributeName:"r",values:"64;92;64",dur:"3.4s",repeatCount:"indefinite"}),
            el("animate",{attributeName:"opacity",values:".45;0;.45",dur:"3.4s",repeatCount:"indefinite"}));
  g.appendChild(pu);
  const rg=el("g",{class:"node"});
  rg.appendChild(el("circle",{cx,cy,r:64,fill:"#15233f",stroke:"#4ea8ff","stroke-width":2}));
  rg.appendChild(T(cx,cy-8,"KYNOVA","nl","middle"));
  rg.appendChild(T(cx,cy+9,"AD multi-axis","ns","middle"));
  const c3=T(cx,cy+26,nAct()+" / 7 arms","ns","middle");c3.setAttribute("fill","#4ea8ff");rg.appendChild(c3);
  rg.onclick=()=>{selected="__root";render();};g.appendChild(rg);
  startFlow(g);
  document.getElementById("legend").innerHTML=`<div style="color:#8694ab">5 built arms · 2 target-stage arms</div>`;
}

/* ---------------- view 4: pair ranking ---------------- */
function drawCombo(){
  svg.innerHTML="";const g=el("g");svg.appendChild(g);particles=[];
  g.appendChild(T(60,44,"Ranked two-arm combinations — by coverage, orthogonality, feasibility","ns"));
  const rows=PAIRS.slice(0,10), y0=92, dy=62;
  rows.forEach((r,i)=>{
    const y=y0+i*dy, A=r.arm_a.replace("IL","IL-").replace("IL--","IL-"), B=r.arm_b.replace("IL","IL-").replace("IL--","IL-");
    const ca=ARMS[A]?ARMS[A].color:"#8694ab", cb=ARMS[B]?ARMS[B].color:"#8694ab";
    const on=(!ARMS[A]||AX[A])&&(!ARMS[B]||AX[B]), op=on?1:.2;
    const gg=el("g",{class:"node",opacity:op});
    gg.appendChild(T(66,y+5,"#"+r.rank,"nl"));
    gg.appendChild(el("rect",{x:104,y:y-15,width:96,height:30,rx:15,fill:"#131b2a",stroke:ca,"stroke-width":1.4}));
    gg.appendChild(T(152,y+5,A,"nn","middle"));
    gg.appendChild(T(212,y+5,"+","ns"));
    gg.appendChild(el("rect",{x:228,y:y-15,width:96,height:30,rx:15,fill:"#131b2a",stroke:cb,"stroke-width":1.4}));
    gg.appendChild(T(276,y+5,B,"nn","middle"));
    gg.appendChild(T(348,y+5,r.direct_axes.replace(/\+/g," + "),"ns"));
    if(r.liabilities&&r.liabilities!=="-")gg.appendChild(T(1172,y+5,"!","nl")).setAttribute("fill","#ffb545");
    gg.onclick=()=>{selected=ARMS[A]?A:B;render();};g.appendChild(gg);});
  document.getElementById("legend").innerHTML=
   `<div style="color:#ffb545">! = carries a documented liability</div>
    <div style="color:#8694ab">ranked by axis coverage and orthogonality</div>`;
}

/* ---------------- flow ---------------- */
function startFlow(layer){
  if(raf)cancelAnimationFrame(raf);
  const dots=particles.map(p=>{const c=el("circle",{r:3,fill:p.col,opacity:.95});layer.appendChild(c);return c;});
  const t0=performance.now();
  (function tick(now){const e=(now-t0)/1000;
    particles.forEach((p,i)=>{const L=p.path.getTotalLength();if(!L)return;
      const u=((e/2.8)+p.off)%1,pt=p.path.getPointAtLength(u*L);
      dots[i].setAttribute("cx",pt.x);dots[i].setAttribute("cy",pt.y);
      dots[i].setAttribute("opacity",(u<.06||u>.94)?.08:.95);});
    raf=requestAnimationFrame(tick);})(t0);
}

/* ---------------- panel ---------------- */
function panel(){
  const P=document.getElementById("panel");
  if(selected==="__root"||!selected){
    P.innerHTML=`<h2>Programme</h2><h3>Multi-axis AD strategy</h3>
      <p>Seven arms across three mechanistic axes, one modality class. Five cytokine arms have designed sequences on file and gate logic reproduced from the stored designs; the two <i>S. aureus</i> effector arms are defined at target level only.</p>
      <div class="kv">
        <div><span>Designs evaluated</span><b>${TOT.evaluated}</b></div>
        <div><span>Arms with sequences</span><b>5 of 7</b></div>
        <div><span>Modality</span><b>de novo minibinder</b></div>
      </div>
      <p style="margin-top:12px;color:#8694ab;font-size:12px">Toggle arms to see which pathogenic edges survive. The loop stays self-sustaining until every return path to the barrier node is cut — that is the argument for combining arms rather than optimising one.</p>`;
    return;}
  if(SA[selected]){const S=SA[selected];
    P.innerHTML=`<h2>Arm · target stage</h2><h3 style="color:${S.color}">${selected}</h3>
      <div style="color:#8694ab;font-size:12px;margin:-2px 0 10px">${S.axis}</div>
      <p>${S.p}</p><div class="liab">${S.note}</div>
      <div class="kv"><div><span>Stage</span><b>target assessment</b></div>
      <div><span>Designed sequences</span><b>none yet</b></div></div>`;return;}
  const A=ARMS[selected];if(!A){P.innerHTML="";return;}
  const pairsFor=PAIRS.filter(r=>[r.arm_a,r.arm_b].map(x=>x.replace("IL","IL-").replace("IL--","IL-")).includes(selected))
    .sort((a,b)=>a.rank-b.rank).slice(0,3);
  P.innerHTML=`<h2>Arm · sequences built</h2><h3 style="color:${A.color}">${selected}</h3>
    <div style="color:#8694ab;font-size:12px;margin:-2px 0 10px">${A.axis}</div>
    <p>${A.note}</p>
    ${A.liab&&A.liab!=="—"?`<div class="liab">${A.liab}</div>`:""}
    <div class="kv">
      <div><span>Epitope sets</span><b>${A.sites}</b></div>
      <div><span>Primary set</span><b>${A.designation}</b></div>
      <div><span>Blockade</span><b style="font-weight:400;color:#c3ccdb">${A.blockade}</b></div>
      <div><span>Designs evaluated</span><b>${A.evaluated}</b></div>
      <div><span>Gate reproduced</span><b style="color:${A.reproduced?"#39d98a":"#ff5d6c"}">${A.reproduced?"verified":"not verified"}</b></div>
    </div>
    ${pairsFor.length?`<div style="margin-top:13px"><h2>Best pairings</h2>${pairsFor.map(r=>
      `<div style="font-size:12px;color:#c3ccdb;padding:2px 0">#${r.rank} &nbsp;${r.arm_a} + ${r.arm_b} &nbsp;<span style="color:#8694ab">${r.direct_axes.replace(/\+/g,", ")}</span></div>`).join("")}</div>`:""}`;
}

function render(){
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  chips();
  ({pipe:drawPipe,mech:drawMech,map:drawMap,combo:drawCombo})[view]();
  const st=document.getElementById("status");
  if(view==="mech"){const c=loopClosed();st.className="status "+(c?"live":"broken");
    st.textContent=c?"Loop self-sustaining — flux still reaches the barrier":"Loop broken — no return path to barrier";}
  else if(view==="pipe"){st.className="status";st.textContent=`${TOT.evaluated} designs across 5 built arms`;}
  else{st.className="status";st.textContent=nAct()+" of 7 arms engaged";}
  panel();
}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
render();
</script></body></html>
